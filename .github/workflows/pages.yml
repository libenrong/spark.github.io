name: Deploy to GitHub Pages

on:
  push:
    branches:
      - 'master'
      - 'main'
  workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: 'pages'
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: yarn

            - name: Install dependencies
              run: yarn install --frozen-lockfile

      # User/org sites (<owner>.github.io) are served from the root, so the
      # basePath must be empty - any other repo is served from /<repo>/.
      - name: Build static export
        env:
          NEXT_PUBLIC_STATIC_EXPORT: '1'
          NEXT_PUBLIC_BASE_PATH: ${{ github.event.repository.name == format('{0}.github.io', github.repository_owner) && '' || format('/{0}', github.event.repository.name) }}
        run: yarn build

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: out

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
